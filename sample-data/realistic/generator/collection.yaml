# The sample collection: source of truth for a small, standardized music library
# used for development and testing.
#
# Everything here is real-world metadata — track titles, durations, artist
# credits and release years come from MusicBrainz (the `musicbrainz:` ids on
# each album record exactly which release each tracklist was taken from). The
# audio itself is *not* real: the generator writes digital silence, so a track's
# FLAC file is only as long as the real recording, and carries none of it.
#
# Alongside the file metadata, each track carries the user-specific data that
# the app stores about it — a rating and a play log — so a generated collection
# arrives looking like a library somebody has actually been listening to.

# How to read an album entry
# --------------------------
#   album_artist  ALBUMARTIST tag, and the name the album's directory is filed
#                 under. One string, however many artists it names.
#   artists       Default ARTIST tags for the album's tracks, one per artist; a
#                 track may override them.
#   genres        Default GENRE tags, likewise overridable per track.
#   musicbrainz   Provenance, not tags: the release group, and the exact release
#                 whose tracklist and durations were transcribed here.
#
# How to read a track entry
# -------------------------
#   number    Track number within the album (disc 1 throughout; no album here
#             is multi-disc).
#   title     TITLE tag, verbatim from MusicBrainz. Note that these use
#             typographic punctuation (’ and ‐, not ' and -), on purpose: real
#             tags do, and the app should survive it.
#   duration  Real running time of the recording, as mm:ss. The generator sizes
#             the silent FLAC to match.
#   artists   ARTIST tags, one per artist. Present only where the track differs
#             from its album's `artists` (a guest, or a credit that only some
#             tracks carry) — otherwise the album's list applies.
#   genres    GENRE tags, one per genre. Present only where the track differs
#             from its album's `genres`.
#   rating    One of the preset ratings — see `ratings` below.
#   plays     The play log: one entry per play, measured in *days before the
#             moment the collection is generated*, most recent first. Storing
#             them relative like this means a regenerated collection always
#             looks freshly used rather than abandoned two years ago.
#
#             Play times are not scattered at random. Most come from album
#             listens, so consecutive tracks are spaced by their own durations
#             and an unloved track goes missing from the middle of a run; the
#             rest are one-off plays of the tracks worth returning to. Popular
#             tracks top out at 100 plays.

version: 1

# Audio written into every generated file. The content is digital silence; only
# the duration carries information.
audio:
  codec: flac
  sample_rate: 44100
  bit_depth: 16
  channels: 2

# Where each track's file lands, relative to the collection root.
path_template: "{album_artist} - {album}/{track_number:02d}. {title}.flac"

ratings:
  skip: 1
  like: 2
  prefer: 3
  love: 4

