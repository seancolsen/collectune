<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>RadioCrate</title>
    <meta name="description" content="Manage and play your audio collection." />

    <!--
      Everything below is host-relative on purpose. RadioCrate is self-hosted and
      every installation is on a different domain, so the manifest, the service
      worker scope and the icons must never name one.
    -->
    <!--
      `use-credentials` matters whenever RadioCrate sits behind cookie-based auth
      (Cloudflare Access, Authelia, an oauth2-proxy). Unlike every other subresource
      here, the manifest is fetched with credentials *omitted* by default, so the
      session cookie doesn't go with it: the auth layer sees an unauthenticated
      request, redirects to its login page on another origin, and the browser
      rejects that as a CORS failure. No manifest, no install prompt. Sending
      credentials costs nothing when there's no auth in front — the request is
      same-origin either way.
    -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" />
    <link rel="icon" href="/icons/icon-16.png" sizes="16x16" />
    <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Standalone display. The first is the modern spelling, the second the one
         iOS still reads. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RadioCrate" />
    <!--
      `default` rather than `black-translucent`: it lets iOS pick a legible status
      bar for the system appearance. Under `black-translucent` the status bar
      follows the *system* theme while the app follows its own stored preference,
      so overriding the theme to the opposite of the system can leave the clock
      unreadable against our own background.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Tints the Android status bar / desktop title bar to match the surface the
      app paints under it. Exactly one `theme-color` meta, rewritten by the
      bootstrap script below and thereafter by `applyThemeToDocument` — never a
      pair of `prefers-color-scheme` metas plus a scripted override. A user
      agent honors the *first* `theme-color` whose `media` matches, so a
      media-less meta appended by script can never outrank an earlier matching
      one: forcing dark on a light-mode phone left the status bar painted our
      light `#f8f8f8` while the app under it went dark, and the system's own
      status-bar icons became unreadable against it.

      The manifest deliberately carries no `theme_color` to pair with this
      (JSON can't hold the comment, so it lives here). An installed Android web
      app bakes that value in and can go on painting the status bar with it,
      ignoring this meta entirely — and a single baked color can't be right for
      an app with two themes. Omitted, the choice falls to the OS, which tints
      the bar to the system appearance its own icons are drawn for.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f8f8" />

    <!-- BEGIN generated: ios-launch-images (cargo xtask icons) -->

    <link

    <!-- END generated: ios-launch-images -->

    <script>
      // Runs before first paint so a forced theme never flashes the other one's
      // background. Mirrors the app's stored-preference read, and points the
      // `theme-color` meta above at whichever surface wins — a stored override
      // or, absent one, the system preference. `applyThemeToDocument` in
      // `state/store.tsx` keeps both in step from here on.
      (function () {
        var pref = null;
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") pref = stored;
        } catch (e) {
          // Private-mode localStorage denial. Falling back to the system
          // preference is what the app itself does too.
        }
        if (pref) document.documentElement.setAttribute("data-theme", pref);
        var dark =
          pref === "dark" ||
          (pref === null &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#1b1b1b" : "#f8f8f8";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
